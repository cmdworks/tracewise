name: Update downloads

# After a release is published, point the download tables in the README and on the site at it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite the tables
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-downloads.sh "${{ github.event.release.tag_name }}"
      - name: Commit
        run: |
          git diff --quiet && { echo "already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: downloads point at ${{ github.event.release.tag_name }}"
          git push
