name: Zed extension

on:
  push:
    branches: [main]
    paths: ["editors/zed/**", ".github/workflows/zed.yml"]
  pull_request:
    paths: ["editors/zed/**", ".github/workflows/zed.yml"]

permissions:
  contents: read

concurrency:
  group: zed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (WebAssembly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "editors/zed -> target"
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
      - uses: actions/upload-artifact@v4
        with:
          name: tracewise-zed
          path: editors/zed/target/wasm32-wasip2/release/tracewise_zed.wasm
